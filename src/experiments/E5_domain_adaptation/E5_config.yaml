# E5_config.yaml

data:
  train_csv: "data/splits/trashnet_train.csv"
  val_csv: "data/splits/trashnet_val.csv"
  test_csv: "data/splits/trashnet_test.csv"        
  realwaste_csv: "data/splits/realwaste_test.csv"   
  image_size: 224

model:
  backbone: "resnet50"
  pretrained: true
  num_classes: 5

training:
  epochs: 100
  batch_size: 32
  num_workers: 8
  optimizer: "adamw"
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: "cosine_annealing"
  early_stopping_patience: 5

  color:
    color_jitter_brightness: 0.5
    color_jitter_contrast: 0.5
    color_jitter_saturation: 0.5
    color_jitter_hue: 0.15
    gaussian_blur: false
    random_erasing: false
    random_perspective: false

  physical:
    color_jitter_brightness: 0.0
    color_jitter_contrast: 0.0
    color_jitter_saturation: 0.0
    color_jitter_hue: 0.0
    gaussian_blur: true
    gaussian_blur_kernel: 5
    gaussian_blur_sigma: [0.1, 2.0]
    random_erasing: true
    random_erasing_prob: 0.3
    random_erasing_scale: [0.02, 0.15]
    random_perspective: true
    random_perspective_distortion: 0.3

  combined:
    color_jitter_brightness: 0.5
    color_jitter_contrast: 0.5
    color_jitter_saturation: 0.5
    color_jitter_hue: 0.15
    gaussian_blur: true
    gaussian_blur_kernel: 5
    gaussian_blur_sigma: [0.1, 2.0]
    random_erasing: true
    random_erasing_prob: 0.3
    random_erasing_scale: [0.02, 0.15]
    random_perspective: true
    random_perspective_distortion: 0.3

  combined_weak:
    color_jitter_brightness: 0.3
    color_jitter_contrast: 0.3
    color_jitter_saturation: 0.3
    color_jitter_hue: 0.09
    gaussian_blur: true
    gaussian_blur_kernel: 5
    gaussian_blur_sigma: [0.1, 2.0]
    random_erasing: true
    random_erasing_prob: 0.3
    random_erasing_scale: [0.02, 0.15]
    random_perspective: true
    random_perspective_distortion: 0.3

  combined_strong:
    color_jitter_brightness: 0.8
    color_jitter_contrast: 0.8
    color_jitter_saturation: 0.8
    color_jitter_hue: 0.24
    gaussian_blur: true
    gaussian_blur_kernel: 5
    gaussian_blur_sigma: [0.1, 2.0]
    random_erasing: true
    random_erasing_prob: 0.3
    random_erasing_scale: [0.02, 0.15]
    random_perspective: true
    random_perspective_distortion: 0.3

  combined_max:
    color_jitter_brightness: 1.0
    color_jitter_contrast: 1.0
    color_jitter_saturation: 1.0
    color_jitter_hue: 0.3
    gaussian_blur: true
    gaussian_blur_kernel: 5
    gaussian_blur_sigma: [0.1, 2.0]
    random_erasing: true
    random_erasing_prob: 0.3
    random_erasing_scale: [0.02, 0.15]
    random_perspective: true
    random_perspective_distortion: 0.3

seeds: [42, 123, 456]

output:
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/logs"
  table_dir: "outputs/tables"
  figure_dir: "outputs/figures"